name: publish

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "app/**"
      - "lib/**"
      - "tools/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # Builds the site and deploys it to the Cloudflare Pages project pa-studying (https://pa-studying.pages.dev/).
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
      - run: npm ci
      - run: npm run build
      # Wrangler, pinned by the Worker's lockfile.
      - run: npm ci
        working-directory: worker
      - run: npx wrangler pages deploy ../dist --project-name=pa-studying --branch=main --commit-hash=${{ github.sha }}
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  # Whole-guide PDFs as release assets pdf-<g> (plan 70 §70.5).
  pdf:
    needs: deploy
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      NODE_OPTIONS: --max-old-space-size=12288
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:data
      - run: node tools/pdf/index.ts --all
