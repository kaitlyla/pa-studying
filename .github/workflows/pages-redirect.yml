name: pages-redirect

# The site lives on Cloudflare Pages (publish.yml). Its old GitHub Pages address serves only a page
# that forwards every path there, keeping the #/route.
on:
  push:
    branches: [main]
    paths:
      - ".github/pages-redirect/**"
      - ".github/workflows/pages-redirect.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-redirect
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          mkdir site
          cp .github/pages-redirect/moved.html site/index.html
          cp .github/pages-redirect/moved.html site/404.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
